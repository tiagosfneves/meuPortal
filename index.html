<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Educacional Senai | Login</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <!-- Imagens de fundo: 50% esquerda e 50% direita -->
    <div class="fundo fundo-esquerda"></div>
    <div class="fundo fundo-direita"></div>

    <!-- Painel central de login (inputs/campos...) -->
    <main class="login">
        <h1>Bem-vindo ao</h1>
        <img class="logo" src="./imgs/logo-portal-senai-1.png" alt="Logo do Portal educacional SENAI">
        <h2>Faça seu login e conheça as novidades</h2>

        <form> <!-- action="" determina a ção do form -->
            <input type="text" placeholder="___.___.___-__">
            <input type="password" placeholder="&bull; &bull; &bull; &bull; &bull; &bull; &bull; &bull; &bull;">
            <button type="submit">Entrar</button>
        </form>

        <p class="links">Nâo tenho acesso. <a href="#">O que fazer?</a></p>
        <a href="#">Esqueci minha senha</a>
    </main>
</body>

</html>
